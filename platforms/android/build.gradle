buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}
repositories {
    google()
    mavenCentral()
}
apply plugin: 'com.android.application'
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation "com.android.installreferrer:installreferrer:2.2"
    implementation "androidx.core:core:1.7.0"
    // Background profile check: replaces AlarmManager exact alarms, which need the
    // Play-restricted SCHEDULE_EXACT_ALARM permission.
    implementation "androidx.work:work-runtime:2.11.2"
}
android {
    namespace "net.is.games.WarlocksDuel"
    // API 36 requires compileSdk >= 36. androiddeployqt writes androidCompileSdkVersion
    // either as a bare number ("36") or as a platform string ("android-36"), so pull the
    // API level out of whatever it wrote and never fall below 36.
    compileSdkVersion Math.max(((androidCompileSdkVersion =~ /(\d+)/)[0][1]).toInteger(), 36)
    buildToolsVersion androidBuildToolsVersion
    ndkVersion androidNdkVersion

    // 16 KB page size support: keep .so files uncompressed and page-aligned in the APK
    packagingOptions.jniLibs.useLegacyPackaging false

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qtAndroidDir + '/src', 'src', 'java']
            aidl.srcDirs = [qtAndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qtAndroidDir + '/res', 'res']
            resources.srcDirs = ['resources']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }
    tasks.withType(JavaCompile) {
        options.incremental = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lintOptions {
        abortOnError false
    }
    aaptOptions {
        noCompress 'rcc'
    }
    defaultConfig {
        applicationId "net.is.games.WarlocksDuel"
        resConfig "en"
        minSdkVersion qtMinSdkVersion
        targetSdkVersion 36
        ndk.abiFilters = qtTargetAbiList.split(",")
    }

    signingConfigs {
        release {
            storeFile file(project.property('RELEASE_STORE_FILE'))
            storePassword project.property('RELEASE_STORE_PASSWORD')
            keyAlias project.property('RELEASE_KEY_ALIAS')
            keyPassword project.property('RELEASE_KEY_PASSWORD')
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}